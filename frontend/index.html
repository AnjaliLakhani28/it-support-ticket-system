<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IT Support Ticket System</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; }
  h1, h2 { color: #222; }
  input, select, textarea, button { display: block; margin: 8px 0; padding: 8px; width: 100%; box-sizing: border-box; }
  button { background: #2563eb; color: white; border: none; cursor: pointer; width: auto; padding: 8px 16px; }
  .ticket { border: 1px solid #ccc; padding: 12px; margin: 10px 0; border-radius: 6px; }
  .error { color: #b91c1c; font-size: 0.9em; margin: 2px 0 8px; }
  .success { color: #15803d; }
  .empty-state { color: #666; font-style: italic; padding: 12px; border: 1px dashed #ccc; border-radius: 6px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.85em; font-weight: bold; color: white; }
  .badge-open { background: #2563eb; }
  .badge-inprogress { background: #d97706; }
  .badge-resolved { background: #15803d; }
  .badge-low { background: #64748b; }
  .badge-medium { background: #0891b2; }
  .badge-high { background: #ea580c; }
  .badge-critical { background: #b91c1c; }
  .badge-overdue { background: #7f1d1d; }
  .timeline { list-style: none; padding-left: 0; }
  .timeline li { border-left: 3px solid #2563eb; padding: 4px 10px; margin: 6px 0; font-size: 0.9em; }
  .timeline li.comment { border-left-color: #15803d; }
  .muted { color: #666; font-size: 0.85em; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .stat { flex: 1 1 110px; border: 1px solid #ccc; border-radius: 6px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 1.5em; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters select { width: auto; flex: 1 1 140px; }
</style>
</head>
<body>

<h1>IT Support Ticket System</h1>

<h2>Submit a Ticket</h2>
<form id="ticketForm" novalidate>
  <input type="text" id="title" placeholder="Title">
  <div class="error" id="titleError"></div>
  <textarea id="description" placeholder="Description"></textarea>
  <div class="error" id="descriptionError"></div>
  <select id="category">
    <option value="">Select Category</option>
    <option value="Hardware">Hardware</option>
    <option value="Software">Software</option>
    <option value="Network">Network</option>
    <option value="Account">Account</option>
  </select>
  <div class="error" id="categoryError"></div>
  <select id="priority">
    <option value="Low">Low priority (resolve within 72h)</option>
    <option value="Medium" selected>Medium priority (resolve within 24h)</option>
    <option value="High">High priority (resolve within 8h)</option>
    <option value="Critical">Critical priority (resolve within 4h)</option>
  </select>
  <input type="text" id="userId" placeholder="Your User ID">
  <div class="error" id="userIdError"></div>
  <button type="submit">Submit Ticket</button>
</form>
<p id="submitMsg"></p>

<h2>View My Tickets</h2>
<input type="text" id="viewUserId" placeholder="Enter your User ID">
<button onclick="loadTickets()">Load Tickets</button>
<div id="ticketList"></div>

<h2>Comments &amp; Activity</h2>
<input type="text" id="commentTicketId" placeholder="Ticket ID">
<input type="text" id="commentAuthor" placeholder="Your User ID or Agent ID">
<textarea id="commentText" placeholder="Write a comment (max 1000 characters)" maxlength="1000"></textarea>
<button onclick="addComment()">Add Comment</button>
<button onclick="loadActivity()">View Ticket Timeline</button>
<p id="commentMsg"></p>
<div id="activityView"></div>

<h2>Agent Dashboard</h2>
<div class="stats" id="statsBar"></div>
<div class="filters">
  <select id="fStatus"><option value="">All statuses</option><option>Open</option><option>In Progress</option><option>Resolved</option></select>
  <select id="fTeam"><option value="">All teams</option><option>Hardware</option><option>Software</option><option>Network</option><option>Account</option></select>
  <select id="fPriority"><option value="">All priorities</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
  <select id="fOverdue"><option value="">Any SLA state</option><option value="true">Overdue only</option></select>
</div>
<button onclick="loadDashboard()">Apply Filters</button>
<div id="dashboardList"></div>

<h2>Agent Actions</h2>
<input type="text" id="ticketId" placeholder="Ticket ID">
<input type="text" id="agentId" placeholder="Agent ID">
<button onclick="assignTicket()">Assign to Me (Open → In Progress)</button>
<textarea id="resolutionNotes" placeholder="Resolution notes"></textarea>
<div class="error" id="resolutionError"></div>
<button onclick="resolveTicket()">Resolve Ticket</button>
<select id="newPriority">
  <option value="Low">Low</option>
  <option value="Medium">Medium</option>
  <option value="High">High</option>
  <option value="Critical">Critical</option>
</select>
<button onclick="changePriority()">Change Priority (recalculates SLA)</button>
<button onclick="loadOverdue()">Show Overdue Tickets</button>
<div id="overdueList"></div>
<p id="agentMsg"></p>

<script>
const API = "/api/tickets";

function statusBadge(status) {
  const cls = status === "Open" ? "badge-open" : status === "In Progress" ? "badge-inprogress" : "badge-resolved";
  return `<span class="badge ${cls}">${status}</span>`;
}

function priorityBadge(priority) {
  const p = priority || 'Medium';
  return `<span class="badge badge-${p.toLowerCase()}">${p}</span>`;
}

function slaInfo(t) {
  if (!t.dueDate) return '';
  const due = new Date(t.dueDate).toLocaleString();
  return t.isOverdue
    ? `<span class="badge badge-overdue">OVERDUE</span> Due: ${due}<br>`
    : `SLA due: ${due}<br>`;
}

function clearErrors() {
  ['titleError','descriptionError','categoryError','userIdError'].forEach(id => {
    document.getElementById(id).textContent = '';
  });
}

document.getElementById('ticketForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearErrors();

  const title = document.getElementById('title').value.trim();
  const description = document.getElementById('description').value.trim();
  const category = document.getElementById('category').value;
  const priority = document.getElementById('priority').value;
  const userId = document.getElementById('userId').value.trim();
  const msg = document.getElementById('submitMsg');
  msg.textContent = '';

  let hasError = false;
  if (!title) { document.getElementById('titleError').textContent = 'Title is required.'; hasError = true; }
  if (!description) { document.getElementById('descriptionError').textContent = 'Description is required.'; hasError = true; }
  if (!category) { document.getElementById('categoryError').textContent = 'Please select a category.'; hasError = true; }
  if (!userId) { document.getElementById('userIdError').textContent = 'User ID is required.'; hasError = true; }
  if (hasError) return;

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description, category, userId, priority })
    });
    const data = await res.json();
    if (res.ok) {
      msg.textContent = `Ticket created! Reference ID: ${data._id}`;
      msg.className = 'success';
      e.target.reset();
    } else {
      msg.textContent = data.message || 'Error creating ticket';
      msg.className = 'error';
    }
  } catch (err) {
    msg.textContent = 'Network error: ' + err.message;
    msg.className = 'error';
  }
});

async function loadTickets() {
  const userId = document.getElementById('viewUserId').value.trim();
  const listDiv = document.getElementById('ticketList');

  if (!userId) {
    listDiv.innerHTML = '<p class="error">Please enter a User ID.</p>';
    return;
  }

  listDiv.innerHTML = '<p>Loading...</p>';

  try {
    const res = await fetch(`${API}/${userId}`);
    const tickets = await res.json();
    if (!tickets.length) {
      listDiv.innerHTML = '<div class="empty-state">No tickets found for this User ID. Submit a ticket above to get started.</div>';
      return;
    }
    listDiv.innerHTML = tickets.map(t => `
      <div class="ticket">
        <strong>${t.title}</strong> (ID: ${t._id})<br>
        Category: ${t.category} | ${statusBadge(t.status)} ${priorityBadge(t.priority)}<br>
        ${slaInfo(t)}
        Description: ${t.description}<br>
        ${t.assignedAgentId ? `Assigned Agent: ${t.assignedAgentId}<br>` : ''}
        ${t.resolutionNotes ? `Resolution: ${t.resolutionNotes}<br>` : ''}
      </div>
    `).join('');
  } catch (err) {
    listDiv.innerHTML = `<p class="error">Error: ${err.message}</p>`;
  }
}

async function assignTicket() {
  const ticketId = document.getElementById('ticketId').value.trim();
  const agentId = document.getElementById('agentId').value.trim();
  const msg = document.getElementById('agentMsg');

  if (!ticketId || !agentId) {
    msg.textContent = 'Ticket ID and Agent ID are both required.';
    msg.className = 'error';
    return;
  }

  try {
    const res = await fetch(`${API}/${ticketId}/assign`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agentId })
    });
    const data = await res.json();
    msg.innerHTML = res.ok ? `Ticket assigned. Status: ${statusBadge(data.status)}` : data.message;
    msg.className = res.ok ? 'success' : 'error';
  } catch (err) {
    msg.textContent = 'Network error: ' + err.message;
    msg.className = 'error';
  }
}

async function resolveTicket() {
  const ticketId = document.getElementById('ticketId').value.trim();
  const agentId = document.getElementById('agentId').value.trim();
  const resolutionNotes = document.getElementById('resolutionNotes').value.trim();
  const msg = document.getElementById('agentMsg');
  const resErrorEl = document.getElementById('resolutionError');
  resErrorEl.textContent = '';

  if (!ticketId || !agentId) {
    msg.textContent = 'Ticket ID and Agent ID are both required.';
    msg.className = 'error';
    return;
  }
  if (!resolutionNotes) {
    resErrorEl.textContent = 'Resolution notes are required to resolve a ticket.';
    return;
  }

  try {
    const res = await fetch(`${API}/${ticketId}/resolve`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ agentId, resolutionNotes })
    });
    const data = await res.json();
    msg.innerHTML = res.ok ? `Ticket resolved. Status: ${statusBadge(data.status)}` : data.message;
    msg.className = res.ok ? 'success' : 'error';
  } catch (err) {
    msg.textContent = 'Network error: ' + err.message;
    msg.className = 'error';
  }
}
// FR-N2: add a comment to a ticket
async function addComment() {
  const id = document.getElementById('commentTicketId').value.trim();
  const authorId = document.getElementById('commentAuthor').value.trim();
  const text = document.getElementById('commentText').value.trim();
  const msg = document.getElementById('commentMsg');
  if (!id || !authorId || !text) {
    msg.textContent = 'Ticket ID, your ID and comment text are all required.';
    msg.className = 'error';
    return;
  }
  try {
    const res = await fetch(`${API}/${id}/comments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, authorId })
    });
    const data = await res.json();
    msg.textContent = res.ok ? 'Comment added.' : data.message;
    msg.className = res.ok ? 'success' : 'error';
    if (res.ok) { document.getElementById('commentText').value = ''; loadActivity(); }
  } catch (err) {
    msg.textContent = 'Network error: ' + err.message;
    msg.className = 'error';
  }
}

// FR-N2: show comments and automatic activity log as one timeline
async function loadActivity() {
  const id = document.getElementById('commentTicketId').value.trim();
  const view = document.getElementById('activityView');
  if (!id) { view.innerHTML = '<p class="error">Enter a Ticket ID.</p>'; return; }
  try {
    const res = await fetch(`${API}/${id}/activity`);
    const data = await res.json();
    if (!res.ok) { view.innerHTML = `<p class="error">${data.message}</p>`; return; }
    const items = [
      ...data.activityLog.map(a => ({ when: a.timestamp, html: `<li><strong>${a.action}</strong> by ${a.actorId} ${a.details ? '— ' + a.details : ''}<br><span class="muted">${new Date(a.timestamp).toLocaleString()}</span></li>` })),
      ...data.comments.map(c => ({ when: c.timestamp, html: `<li class="comment">💬 <strong>${c.authorId}</strong>: ${c.text}<br><span class="muted">${new Date(c.timestamp).toLocaleString()}</span></li>` }))
    ].sort((a, b) => new Date(a.when) - new Date(b.when));
    view.innerHTML = `<div class="ticket"><strong>${data.title}</strong> ${statusBadge(data.status)}
      <ul class="timeline">${items.map(i => i.html).join('') || '<li>No activity yet.</li>'}</ul></div>`;
  } catch (err) {
    view.innerHTML = `<p class="error">Error: ${err.message}</p>`;
  }
}

// FR-N3: agent dashboard - summary counts + filtered list
async function loadStats() {
  const bar = document.getElementById('statsBar');
  try {
    const res = await fetch('/api/agent/stats');
    const s = await res.json();
    const box = (label, n) => `<div class="stat"><b>${n || 0}</b>${label}</div>`;
    bar.innerHTML = box('Total', s.total) + box('Open', s.byStatus.Open) +
      box('In Progress', s.byStatus['In Progress']) + box('Resolved', s.byStatus.Resolved) +
      box('Overdue', s.overdue);
  } catch (err) {
    bar.innerHTML = `<p class="error">Could not load stats: ${err.message}</p>`;
  }
}

async function loadDashboard() {
  const params = new URLSearchParams();
  [['status','fStatus'],['team','fTeam'],['priority','fPriority'],['overdue','fOverdue']].forEach(([k, id]) => {
    const v = document.getElementById(id).value;
    if (v) params.append(k, v);
  });
  const div = document.getElementById('dashboardList');
  try {
    const res = await fetch('/api/agent/tickets?' + params.toString());
    const data = await res.json();
    if (!res.ok) { div.innerHTML = `<p class="error">${data.message}</p>`; return; }
    div.innerHTML = `<p class="muted">${data.count} ticket(s) found</p>` + (data.tickets.map(t => `
      <div class="ticket"><strong>${t.title}</strong> (ID: ${t._id})<br>
      Team: ${t.team} | ${statusBadge(t.status)} ${priorityBadge(t.priority)}<br>
      ${slaInfo(t)}${t.assignedAgentId ? `Agent: ${t.assignedAgentId}` : 'Unassigned'}</div>`).join('') ||
      '<div class="empty-state">No tickets match these filters.</div>');
    loadStats();
  } catch (err) {
    div.innerHTML = `<p class="error">Error: ${err.message}</p>`;
  }
}
loadStats();

// FR-N1: agent changes priority -> backend recalculates SLA due date
async function changePriority() {
  const ticketId = document.getElementById('ticketId').value.trim();
  const agentId = document.getElementById('agentId').value.trim();
  const priority = document.getElementById('newPriority').value;
  const msg = document.getElementById('agentMsg');
  if (!ticketId) { msg.textContent = 'Ticket ID is required.'; msg.className = 'error'; return; }
  try {
    const res = await fetch(`${API}/${ticketId}/priority`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ priority, agentId })
    });
    const data = await res.json();
    msg.innerHTML = res.ok
      ? `Priority set to ${priorityBadge(data.ticket.priority)} — ${data.sla}. New due date: ${new Date(data.ticket.dueDate).toLocaleString()}${data.escalate ? ' <strong>(Escalated to team lead)</strong>' : ''}`
      : data.message;
    msg.className = res.ok ? 'success' : 'error';
  } catch (err) {
    msg.textContent = 'Network error: ' + err.message;
    msg.className = 'error';
  }
}

// FR-N1: list all unresolved tickets past their SLA due date
async function loadOverdue() {
  const div = document.getElementById('overdueList');
  try {
    const res = await fetch(`${API}/overdue`);
    const tickets = await res.json();
    div.innerHTML = tickets.length
      ? tickets.map(t => `<div class="ticket"><strong>${t.title}</strong> (ID: ${t._id})<br>${statusBadge(t.status)} ${priorityBadge(t.priority)}<br>${slaInfo(t)}</div>`).join('')
      : '<div class="empty-state">No overdue tickets. All SLAs are being met.</div>';
  } catch (err) {
    div.innerHTML = `<p class="error">Error: ${err.message}</p>`;
  }
}
</script>

</body>
</html>
